<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KiteCheck">
<meta name="theme-color" content="#06283d">
<title>KiteCheck</title>
<style>
:root{
  --bg:#041e30;--card:#0a2e47;--card2:#0e3a59;--line:#16486b;--txt:#e8f4fb;--mut:#8fb3c9;
  --great:#22c55e;--good:#84cc16;--ok:#facc15;--bad:#f97316;--danger:#ef4444;--none:#475569;--acc:#38bdf8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 24px)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:24px;margin:0;letter-spacing:-.3px}
h1 span{color:var(--acc)}
button{font:inherit;color:inherit;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
button.primary{background:var(--acc);color:#04223a;border:0;font-weight:600}
select,input{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.row{display:flex;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.muted{color:var(--mut);font-size:13px}
.hero{text-align:center;padding:18px 14px}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px;color:#04150f}
.score{font-size:64px;font-weight:800;line-height:1;margin:10px 0 4px;letter-spacing:-2px}
.verdict{font-size:20px;font-weight:700;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card2);border-radius:12px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:18px}
.stat small{color:var(--mut);font-size:11px}
.reasons{list-style:none;padding:0;margin:12px 0 0;text-align:left;font-size:14px}
.reasons li{padding:5px 0;border-top:1px solid var(--line)}
.kite{margin-top:10px;font-size:14px}
h2{font-size:16px;margin:0 0 10px}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.h{flex:0 0 54px;text-align:center;background:var(--card2);border-radius:12px;padding:6px 2px;scroll-snap-align:start;font-size:12px}
.h .bar{height:6px;border-radius:3px;margin:5px 6px}
.h .kn{font-size:16px;font-weight:700}
.h .arr{display:inline-block;font-size:14px}
.day{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .dn{width:52px;font-weight:600;text-transform:capitalize}
.day .info{flex:1;font-size:13px;color:var(--mut)}
.day .info b{color:var(--txt)}
.pill{min-width:76px;text-align:center;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700;color:#04150f}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;margin-top:8px}
.legend span{padding:2px 8px;border-radius:999px;color:#04150f;font-weight:600}
dialog{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:18px;width:min(94vw,460px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.6)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.err{background:#3b1220;border-color:#7f1d1d}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.seahead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.wh{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1}
.sstate{font-weight:700;font-size:15px}
#waveCv{width:100%;height:190px;display:block;border-radius:14px;margin-top:10px;touch-action:pan-y;cursor:grab;background:#062a42}
#seaScrub{width:100%;margin:12px 0 4px;accent-color:var(--acc)}
#tideCv{width:100%;height:64px;display:block;margin-top:6px}
.seagrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
dialog#dlg{width:min(96vw,480px);max-height:92vh;padding:0;overflow:hidden;flex-direction:column}
dialog#dlg[open]{display:flex}
.st-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.st-head h2{margin:0;font-size:22px}
.st-x{border-radius:50%;width:36px;height:36px;padding:0;font-size:15px}
.st-tabs{display:flex;gap:6px;padding:0 16px 12px;border-bottom:1px solid var(--line)}
.st-tab{flex:1;padding:9px 4px;font-size:14px;background:transparent;border-color:transparent;color:var(--mut)}
.st-tab.on{background:var(--card2);border-color:var(--line);color:var(--txt);font-weight:600}
.st-body{overflow-y:auto;padding:2px 16px 16px;flex:1;-webkit-overflow-scrolling:touch}
.st-sec{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.st-sec h3{margin:0 0 8px;font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.st-big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.st-big span{color:var(--acc)}
.st-sec input[type=range]{width:100%;accent-color:var(--acc);padding:0;border:0;background:none;margin:10px 0 4px}
.st-levels{display:grid;gap:8px}
.st-lv{text-align:left;display:flex;flex-direction:column;gap:2px;background:var(--card);padding:10px 12px}
.st-lv small{color:var(--mut);font-size:12px}
.st-lv.on,.st-chip.on,.st-dir.on{border-color:var(--acc);background:rgba(56,189,248,.2);box-shadow:inset 0 0 0 1px var(--acc)}
.st-chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}
.st-chip{padding:10px 0;font-weight:700;background:var(--card)}
.st-compass{position:relative;width:230px;height:230px;margin:8px auto 6px;border-radius:50%;background:radial-gradient(circle,#0c4a6e 0 26%,var(--card) 27%);border:1px solid var(--line)}
.st-beach{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px}
.st-dir{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;padding:0;border-radius:50%;font-size:13px;font-weight:700;background:var(--card2)}
.st-needle{position:absolute;left:calc(50% - 3px);top:17%;height:33%;width:6px;border-radius:3px;background:linear-gradient(var(--acc),rgba(56,189,248,0));transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.st-center{text-align:center;margin-top:6px}
.st-sw{display:flex;align-items:center;gap:12px;color:var(--txt);font-size:15px;margin:0;cursor:pointer}
.st-sw input{display:none}
.st-sw span{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.st-sw span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.st-sw input:checked+span{background:var(--great)}
.st-sw input:checked+span:after{left:23px}
.st-wide{width:100%;margin-top:10px}
.st-danger{color:#fca5a5;border-color:#7f1d1d;background:#3b1220}
.st-foot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.st-foot button{flex:1;padding:12px;font-weight:600}
.g-res{display:flex;gap:14px;align-items:center;margin-top:6px}
.g-size{font-size:34px;font-weight:800;color:var(--acc);white-space:nowrap}
.g-table{display:grid;gap:4px}
.g-row{display:grid;grid-template-columns:1fr 1fr 24px;padding:6px 10px;border-radius:8px;background:var(--card)}
.g-row.on{background:rgba(56,189,248,.2);box-shadow:inset 0 0 0 1px var(--acc)}
.g-card{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.g-card:first-of-type{border-top:0;padding-top:0}
.g-ic{font-size:22px;line-height:1.2}
.nav{position:sticky;top:env(safe-area-inset-top);z-index:5;display:flex;gap:6px;margin:0 -14px 12px;padding:6px 14px;background:rgba(4,30,48,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav button{flex:1;padding:10px 6px;font-weight:600;background:transparent;border-color:transparent;color:var(--mut)}
.nav button.on{background:var(--card2);border-color:var(--line);color:var(--txt)}
.ghead{margin:2px 0 4px}
.ghead h2{font-size:22px;margin:0 0 4px}
.upd{font-size:12px;color:var(--mut);text-align:right;margin:-4px 2px 8px}
.stale{background:#3a2a06;border-color:#a16207;font-size:14px}
.stale button{margin-left:6px;padding:4px 10px}
.alerts{padding:10px 12px}
.al{padding:9px 11px;border-radius:10px;font-size:14px;font-weight:600;margin-top:6px}
.al:first-child{margin-top:0}
.al.crit{background:#450a0a;border:1px solid #b91c1c;color:#fecaca}
.al.warn{background:#3a2a06;border:1px solid #a16207;color:#fde68a}
.hero2{padding:16px}
.h2top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.5px}
.h2wind{display:flex;align-items:baseline;gap:6px;margin-top:8px}
.h2wind b{font-size:76px;line-height:.95;font-weight:800;letter-spacing:-3px}
.h2wind span{font-size:22px;color:var(--mut);font-weight:700}
.h2sub{font-size:16px;margin-top:4px}
.hero2 .verdict{margin-top:12px}
.h2score{font-size:12px;color:var(--mut);margin-top:12px}
.why{margin-top:10px}
.why summary{cursor:pointer;color:var(--acc);font-size:14px;font-weight:600}
.mini{display:flex;gap:12px;align-items:flex-start}
.mi-ic{font-size:26px;line-height:1.1}
.mi-t{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.mi-v{font-size:17px;margin:2px 0 3px}
.wchart{width:100%;height:auto;display:block}
.wc-t{font-size:9px;fill:#8fb3c9}
.wc-leg{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mut);margin:6px 0 10px}
.wc-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.cmp-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.cmp-row:first-child{border-top:0;padding-top:0}
.cmp-row .info{flex:1;font-size:13px;color:var(--mut)}
.cmp-row .info b{color:var(--txt);font-size:14px}
.when-chip{display:inline-flex;align-items:center;gap:6px;margin-bottom:6px;padding:5px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--txt);font-size:13px;font-weight:600;transition:all .2s}
.when-chip.now{border-color:var(--acc);color:var(--acc);background:rgba(56,189,248,.12)}
.warn{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Kite<span>Check</span></h1>
  <div class="row">
    <button id="btnRefresh" aria-label="Atualizar">↻</button>
    <button id="btnSettings" aria-label="Configurações">⚙︎</button>
  </div>
</header>
<nav class="nav" id="nav"><button class="on" data-view="prev">🪁 Previsão</button><button data-view="guia">📚 Guia de kites</button></nav>
<div id="viewPrev">

<div class="card" style="padding:10px">
  <div class="row">
    <select id="spot" aria-label="Pico"></select>
    <button id="btnGps" title="Usar minha localização">📍</button>
  </div>
  <div class="muted" id="spotInfo" style="margin-top:6px"></div>
</div>

<div id="main"><div class="card hero"><span class="spin"></span> Carregando previsão…</div></div>
</div>
<div id="viewGuia" hidden></div>

<dialog id="dlg"></dialog>

<script>
"use strict";

// Ícone do app (desenhado na hora, para a Tela de Início)
(function(){try{
  const c=document.createElement("canvas");c.width=c.height=180;const g=c.getContext("2d");
  g.fillStyle="#082f49";g.fillRect(0,0,180,180);
  g.fillStyle="#facc15";g.beginPath();g.arc(90,65,55,Math.PI,0);g.fill();
  g.strokeStyle="#fff";g.lineWidth=3;g.beginPath();g.moveTo(40,65);g.lineTo(90,120);g.lineTo(140,65);g.moveTo(90,65);g.lineTo(90,120);g.stroke();
  g.strokeStyle="#38bdf8";g.lineWidth=8;
  [130,152].forEach(y=>{g.beginPath();for(let x=0;x<=180;x+=2)g.lineTo(x,y+Math.sin(x/18)*6);g.stroke();});
  const u=c.toDataURL("image/png");
  ["apple-touch-icon","icon"].forEach(r=>{const l=document.createElement("link");l.rel=r;l.href=u;document.head.appendChild(l);});
}catch(e){}})();
// ---------- Picos pré-cadastrados (orientação do mar aproximada; ajuste em ⚙︎) ----------
const DEFAULT_SPOTS = [
  {id:"pepe",  name:"Barra da Tijuca (Pepê) – RJ", lat:-23.0145, lon:-43.3440, sea:180},
  {id:"recreio",name:"Recreio – RJ",               lat:-23.0280, lon:-43.4650, sea:180},
  {id:"arraial",name:"Arraial do Cabo (Praia Grande) – RJ", lat:-22.9720, lon:-42.0340, sea:180},
  {id:"cabofrio",name:"Cabo Frio (Praia do Forte) – RJ", lat:-22.8890, lon:-42.0150, sea:135},
  {id:"buzios", name:"Búzios (Praia Rasa) – RJ",   lat:-22.7330, lon:-41.9580, sea:90},
  {id:"cumbuco",name:"Cumbuco – CE",               lat:-3.6270,  lon:-38.7290, sea:45},
  {id:"jeri",   name:"Jericoacoara – CE",          lat:-2.7950,  lon:-40.5130, sea:0},
  {id:"siqueira",name:"Lagoa de Araruama (Siqueira) – RJ", lat:-22.8740, lon:-42.0440, sea:315, lagoon:true},
  {id:"spa",    name:"São Pedro da Aldeia (Lagoa) – RJ", lat:-22.8420, lon:-42.1030, sea:180, lagoon:true},
  {id:"prea",   name:"Preá – CE",                  lat:-2.8160,  lon:-40.4180, sea:0},
  {id:"taiba",  name:"Taíba – CE",                 lat:-3.5070,  lon:-38.9060, sea:45}
];
const LEVELS = {
  iniciante:    {max:20, gustDelta:8,  wave:1.0},
  intermediario:{max:28, gustDelta:12, wave:2.0},
  avancado:     {max:35, gustDelta:15, wave:3.5}
};
const COLORS = {great:"var(--great)",good:"var(--good)",ok:"var(--ok)",bad:"var(--bad)",danger:"var(--danger)",none:"var(--none)"};
const LABEL  = {great:"Ótimo",good:"Bom",ok:"Regular",bad:"Ruim",danger:"Perigoso",none:"Noite"};
const DIRS = ["N","NNE","NE","ENE","L","ELE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];

// ---------- Armazenamento seguro ----------
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let spots = store.get("kc_spots", DEFAULT_SPOTS.slice());
(function(){ const del = store.get("kc_deleted", []);
  DEFAULT_SPOTS.forEach(d => { const s = spots.find(x => x.id === d.id);
    if (!s && del.indexOf(d.id) < 0) spots.push(d); else if (s && d.lagoon) s.lagoon = true; }); })();
let cfg = Object.assign({weight:75, level:"intermediario", min:12, spot:"pepe", kites:[]}, store.get("kc_cfg", {}));
let lastData = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dirName = deg => DIRS[Math.round(((deg%360)+360)%360/22.5)%16];
const angDiff = (a,b) => {const d=Math.abs(((a-b)%360+540)%360-180);return d;};

// ---------- Avaliação de uma hora ----------
function rate(h, spot){
  const L = LEVELS[cfg.level];
  const reasons = [];
  let score = 100, danger = false;

  if (!h.isDay) return {score:0, cls:"none", reasons:["Está de noite — não dá pra velejar."]};

  // Tempestade / raios
  if (h.code >= 95) { danger = true; reasons.push("⛈️ Risco de trovoada/raios — NÃO entre na água."); }

  // Vento médio
  const w = h.wind;
  if (w < cfg.min - 3)      { score -= 80; reasons.push(`💨 Vento fraco demais (${w.toFixed(0)} nós).`); }
  else if (w < cfg.min)     { score -= 45; reasons.push(`💨 Vento no limite (${w.toFixed(0)} nós) — só com kite grande ou foil.`); }
  else if (w <= L.max)      { if (w < cfg.min + 3) { score -= 25; reasons.push("👌 Vento no limite de baixo: " + w.toFixed(0) + " nós."); } else { reasons.push("✅ Vento bom: " + w.toFixed(0) + " nós."); if (w > 24) score -= 8; } }
  else if (w <= L.max + 5)  { score -= 40; reasons.push(`⚠️ Vento forte para o seu nível (${w.toFixed(0)} nós).`); }
  else                      { danger = true; reasons.push(`🚫 Vento muito forte (${w.toFixed(0)} nós).`); }

  // Seus kites (se cadastrados)
  const Q = cfg.kites || [];
  if (Q.length && w >= cfg.min - 3) {
    const ideal = cfg.weight * 2.2 / Math.max(w, 1), idealG = cfg.weight * 2.2 / Math.max(h.gust, 1);
    const k = Q.reduce((a,b) => Math.abs(b - ideal) < Math.abs(a - ideal) ? b : a);
    h.kite = k;
    if (k < ideal * 0.78) { score -= Math.min(45, Math.round((ideal * 0.78 - k) * 8) + 10); reasons.push("🪁 Com seus kites fica fraco: o melhor seria o de " + k + " m², mas o ideal é ~" + Math.round(ideal) + " m²."); }
    else if (k > idealG * 1.35) { score -= 35; reasons.push((k > idealG * 1.7 ? "🚫" : "⚠️") + " Com seus kites fica forte demais nas rajadas: o de " + k + " m² passa do ideal (~" + Math.round(idealG) + " m²)."); if (k > idealG * 1.7) danger = true; }
    else reasons.push("🪁 Vá de " + k + " m².");
  }

  // Rajadas
  const gd = h.gust - w;
  if (gd > L.gustDelta + 6)      { score -= 40; reasons.push(`🌪️ Muito rajado (rajadas de ${h.gust.toFixed(0)} nós).`); if (h.gust > L.max + 8) danger = true; }
  else if (gd > L.gustDelta)     { score -= 20; reasons.push(`⚠️ Rajado: rajadas até ${h.gust.toFixed(0)} nós.`); }
  else if (w >= cfg.min)         { reasons.push(`👍 Vento constante (rajadas ${h.gust.toFixed(0)} nós).`); }

  // Rajadas perigosas não podem ser compensadas por uma nota boa
  if (h.gust > L.max + 5) { danger = true; reasons.push("🚫 Rajadas de " + h.gust.toFixed(0) + " nós: acima do limite do seu nível (" + L.max + " nós)."); }
  else if (w >= 10 && h.gust >= 25 && h.gust >= w * 1.6) { danger = true; reasons.push("🚫 Vento muito irregular: rajadas " + Math.round((h.gust / w - 1) * 100) + "% mais fortes que a média."); }

  // Direção vs. praia
  const a = angDiff(h.dir, spot.sea);   // 0 = vem direto do mar
  const dn = dirName(h.dir);
  if (a <= 25)        { score -= 15; reasons.push(`↘️ Vento ${dn} onshore (de frente pro mar): seguro, mas difícil de sair.`); }
  else if (a <= 100)  { reasons.push(`✅ Direção ${dn} lateral (side/side-on): ideal.`); }
  else if (a <= 135)  { score -= 35; reasons.push(`⚠️ Direção ${dn} side-off: vento saindo da terra, cuidado.`); }
  else if (w >= cfg.min - 3 && spot.lagoon) { score -= 30; reasons.push("⚠️ Vento " + dn + " saindo da margem: na lagoa é menos crítico, mas não se afaste."); }
  else if (w >= cfg.min - 3) { danger = true; reasons.push(`🚫 Vento ${dn} OFFSHORE (vem da terra): te leva pro alto-mar.`); }
  else                { score -= 30; reasons.push(`↖️ Vento ${dn} offshore (vem da terra) — fraco agora, mas fique atento.`); }

  // Chuva
  if (h.rain >= 70)      { score -= 20; reasons.push(`🌧️ Chuva provável (${h.rain}%).`); }
  else if (h.rain >= 40) { score -= 8;  reasons.push(`🌦️ Chance de chuva ${h.rain}%.`); }

  // Ondas
  if (h.wave != null && !spot.lagoon) {
    if (h.wave > L.wave + 1)   { score -= 30; reasons.push(`🌊 Mar grande (${h.wave.toFixed(1)} m) para o seu nível.`); }
    else if (h.wave > L.wave)  { score -= 12; reasons.push(`🌊 Ondas de ${h.wave.toFixed(1)} m.`); }
  }

  // Concordância entre modelos de previsão
  if (h.conf === "baixa" && w >= cfg.min - 3) { score -= 8; reasons.push("🤔 Os modelos de previsão discordam (" + h.spread.toFixed(0) + " nós de diferença) — previsão incerta."); }

  score = Math.max(0, Math.min(100, Math.round(score)));
  if (danger) score = Math.min(score, 15);
  const cls = danger ? "danger" : score >= 80 ? "great" : score >= 62 ? "good" : score >= 42 ? "ok" : "bad";
  const alerts = reasons.filter(x => /^(🚫|⛈️)/u.test(x)).map(t => ({lvl:"crit", t}))
    .concat(reasons.filter(x => /^(⚠️|🌪️|🌊 Mar grande)/u.test(x)).map(t => ({lvl:"warn", t})));
  return {score, cls, reasons, alerts};
}

function kiteSize(wind){
  if (wind < 8) return null;
  const s = cfg.weight / wind * 2.2;
  return Math.max(5, Math.min(17, Math.round(s)));
}
function wetsuit(t){
  if (t >= 26) return "lycra/sem roupa";
  if (t >= 23) return "shorty ou long john 2 mm";
  if (t >= 19) return "roupa 3/2 mm";
  return "roupa 4/3 mm";
}

// ---------- Busca dos dados (Open-Meteo, grátis e sem chave) ----------
async function load(){
  const spot = spots.find(s => s.id === cfg.spot) || spots[0];
  if (!spot) { $("#main").innerHTML = `<div class="card">Nenhum pico cadastrado. Toque em 📍 para adicionar sua localização.</div>`; return; }
  cfg.spot = spot.id; store.set("kc_cfg", cfg);
  renderSpotSelect();
  $("#spotInfo").textContent = `Mar para ${dirName(spot.sea)} · ${spot.lat.toFixed(3)}, ${spot.lon.toFixed(3)}`;
  $("#main").innerHTML = `<div class="card hero"><span class="spin"></span> Carregando previsão…</div>`;

  const base = `latitude=${spot.lat}&longitude=${spot.lon}&timezone=auto&forecast_days=7`;
  const wUrl = `https://api.open-meteo.com/v1/forecast?${base}&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&daily=sunrise,sunset,uv_index_max&wind_speed_unit=kn`;
  const eUrl = "https://api.open-meteo.com/v1/forecast?" + base + "&hourly=wind_speed_10m&models=ecmwf_ifs025,gfs_seamless,icon_seamless&wind_speed_unit=kn";
  const mUrl = `https://marine-api.open-meteo.com/v1/marine?${base}&hourly=wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_period,swell_wave_direction,wind_wave_height,sea_surface_temperature,sea_level_height_msl`;
  try{
    let wr, mr, er, cachedAt = null;
    try {
    [wr, mr, er] = await Promise.all([
      getJSON(wUrl),
      getJSON(mUrl).catch(() => null),
      getJSON(eUrl).catch(() => null)
    ]);
    store.set("kc_last", {id:spot.id, ts:Date.now(), wr:wr, mr:mr, er:er});
    } catch (netErr) {
      const c = store.get("kc_last", null);
      if (!c || c.id !== spot.id) throw netErr;
      wr = c.wr; mr = c.mr; er = c.er; cachedAt = c.ts;
    }
    const H = wr.hourly, waves = {};
    if (mr && mr.hourly) { const M = mr.hourly, g = (k,i) => (M[k] ? M[k][i] : null);
      M.time.forEach((t,i) => waves[t] = {wh:g("wave_height",i), wd:g("wave_direction",i), wp:g("wave_period",i), sh:g("swell_wave_height",i), sp:g("swell_wave_period",i), sd:g("swell_wave_direction",i), ww:g("wind_wave_height",i), sst:g("sea_surface_temperature",i), tide:g("sea_level_height_msl",i)}); }
    const hours = H.time.map((t,i) => ({
      t, date:new Date(t), wind:H.wind_speed_10m[i] ?? 0, gust:H.wind_gusts_10m[i] ?? 0, dir:H.wind_direction_10m[i] ?? 0,
      temp:H.temperature_2m[i], rain:H.precipitation_probability[i] ?? 0, code:H.weather_code[i] ?? 0,
      isDay:H.is_day[i] === 1, sea: waves[t] || null, wave: (waves[t] && waves[t].wh != null) ? waves[t].wh : null
    }));
    // Confiança: diferença de vento entre os modelos
    let nModels = 0;
    if (er && er.hourly) {
      const keys = Object.keys(er.hourly).filter(k => k.indexOf("wind_speed_10m_") === 0); nModels = keys.length;
      const idxOf = {}; er.hourly.time.forEach((t,i) => idxOf[t] = i);
      hours.forEach(h => { const i = idxOf[h.t]; if (i == null) return;
        const v = keys.map(k => er.hourly[k][i]).filter(x => x != null);
        if (v.length < 2) return;
        h.spread = Math.max(...v) - Math.min(...v);
        h.conf = h.spread <= 4 ? "alta" : h.spread <= 8 ? "média" : "baixa"; });
    }
    hours.forEach(h => h.r = rate(h, spot));
    const sun = {};
    if (wr.daily && wr.daily.time) wr.daily.time.forEach((d,i) => sun[d] = {rise:(wr.daily.sunrise[i]||"").slice(11,16), set:(wr.daily.sunset[i]||"").slice(11,16), uv: wr.daily.uv_index_max ? wr.daily.uv_index_max[i] : null});
    lastData = {spot, hours, utcOffset: wr.utc_offset_seconds, sun, nModels, cachedAt, fetchedAt: cachedAt ? null : Date.now()};
    store.set("kc_cache_"+spot.id, {saved:Date.now()});
    render();
  }catch(e){
    $("#main").innerHTML = `<div class="card err">Não consegui baixar a previsão. Verifique sua internet e toque em ↻.<div class="muted" style="margin-top:6px">${esc(e.message)}</div></div>`;
  }
}

// Busca com novas tentativas (o servidor às vezes falha por alguns segundos)
async function getJSON(url, tries){
  tries = tries || 3; let last;
  for (let k = 0; k < tries; k++) {
    try {
      const r = await fetch(url); const tx = await r.text();
      if (!r.ok) throw new Error("HTTP " + r.status);
      return JSON.parse(tx);
    } catch(e) { last = e; if (k < tries - 1) await new Promise(res => setTimeout(res, 800 * (k + 1))); }
  }
  throw new Error("servidor de previsão instável, tente de novo");
}

// "Agora" no fuso do pico
function nowKey(offsetSec){
  const d = new Date(Date.now() + offsetSec*1000);
  return d.toISOString().slice(0,13) + ":00";
}

function render(){
  const {spot, hours, utcOffset} = lastData;
  const nk = nowKey(utcOffset);
  let idx = hours.findIndex(h => h.t === nk); if (idx < 0) idx = 0;

  const r = cur.r;

  const verdictTxt = {
    great:"Tá bombando! Bora velejar 🪁", good:"Tá bom pra kite!", ok:"Dá pra ir, mas não é o ideal",

  const dayKeys = Object.keys(byDay).sort();

  for (const k of dayKeys.slice(0, 2)) { win = bestWindow(byDay[k]); if (win) break; }

  let html = statusHTML();

    '<div class="muted" style="margin-top:8px">Alertas aparecem mesmo quando a nota geral é boa.</div></div>';

  html += '<div class="card hero2">' +
    '<div class="h2top"><span class="muted">CONDIÇÕES AGORA · ' + fmtH(cur.date) + '</span><span class="badge" style="background:' + COLORS[r.cls] + '">' + LABEL[r.cls] + '</span></div>' +
    '<div class="h2wind"><b>' + cur.wind.toFixed(0) + '</b><span>nós</span></div>' +
    '<div class="h2sub">Rajadas de <b>' + cur.gust.toFixed(0) + '</b> · vem de <b>' + dirName(cur.dir) + '</b> <span class="arr" style="transform:rotate(' + (cur.dir + 180) + 'deg)">↑</span></div>' +
    '<div class="verdict">' + verdictTxt + '</div>' +
    '<div class="stats">' + stat(cur.temp != null ? cur.temp.toFixed(0) + "°" : "–", "temperatura") + stat(cur.rain + "%", "chuva") +
      stat(spot.lagoon ? "lagoa" : (cur.wave != null ? cur.wave.toFixed(1) + " m" : "–"), "ondas") + '</div>' +
    heroExtra() +
    '<div class="h2score">Índice KiteCheck: <b>' + (r.cls === "none" ? "–" : r.score + "/100") + '</b> · estimativa automática, não é autorização pra entrar na água.</div>' +
    (r.reasons.length ? '<details class="why"><summary>Por que essa avaliação?</summary><ul class="reasons">' + r.reasons.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul></details>' : '') +
  '</div>';

  // Equipamento
  if (r.cls !== "none" && ks) {
    const water = cur.sea && cur.sea.sst != null ? cur.sea.sst : cur.temp;
    html += '<div class="card mini"><div class="mi-ic">🪁</div><div><div class="mi-t">Equipamento</div>' +
      '<div class="mi-v">' + (cur.kite ? 'Seu kite mais indicado: <b>' + cur.kite + ' m²</b>' : 'Tamanho estimado: <b>' + ks + ' m²</b>') + '</div>' +
      '<div class="muted">' + (cur.kite ? 'Estimativa pro seu peso: ' + ks + ' m²' : 'Cadastre seus kites em ⚙︎ pra uma sugestão com o seu equipamento') +
      (ksG && ksG < ks - 1 ? ' · nas rajadas, ' + ksG + ' m²' : '') + '. Roupa: ' + wetsuit(water) + '. É uma estimativa: confira os limites do fabricante.</div></div></div>';
  }

  // Melhor janela
  html += '<div class="card mini"><div class="mi-ic">⏱️</div><div><div class="mi-t">Melhor janela</div>' +
    (win ? '<div class="mi-v"><b>' + fmtDay(win.start.date) + ' ' + fmtH(win.start.date) + '–' + fmtH(new Date(win.end.date.getTime() + 3600e3)) + '</b> (' + win.len + 'h)</div>' +
           '<div class="muted">Vento médio ' + win.avg + ' nós, rajadas até ' + win.maxGust + ' · melhor às ' + fmtH(win.peak.date) + '. Estimativa: as condições podem mudar rápido.</div>'
         : '<div class="mi-v">Sem janela boa hoje nem amanhã</div><div class="muted">Veja os próximos dias abaixo ou compare outros picos.</div>') +
  '</div></div>';

  // Mar (onda animada + rolagem pelas horas)
  if (!spot.lagoon && hours.some(h => h.sea && h.sea.wh != null)) {
    html += '<div class="card" id="seaCard"><h2>🌊 Mar</h2>' +
      '<div class="seahead"><div><div class="muted" id="seaWhen"></div><div class="wh" id="seaH">–</div></div>' +
      '<div style="text-align:right"><div class="sstate" id="seaState"></div><div class="muted" id="seaDir"></div></div></div>' +
      '<canvas id="waveCv" aria-label="Onda animada"></canvas>' +
      '<input type="range" id="seaScrub" min="' + idx + '" max="' + (hours.length - 1) + '" value="' + idx + '" aria-label="Escolher horário">' +
      '<div class="muted" style="text-align:center">Arraste a onda ou a barra para ver as próximas horas</div>' +
      '<div class="seagrid">' +

        '<div class="stat"><b id="seaWind">–</b><small>mar de vento</small></div>' +
        '<div class="stat"><b id="seaTemp">–</b><small>temp. da água</small></div>' +
        '<div class="stat"><b id="seaTide">–</b><small>maré (modelo, aprox.)</small></div>' +
      '</div><canvas id="tideCv" aria-label="Gráfico da maré"></canvas></div>';
  }

  // Gráfico + próximas horas
  html += '<div class="card"><h2>📈 Vento nas próximas 24h</h2>' + windChart(hours, idx) + '<div class="hours">';
  hours.slice(idx, idx + 24).forEach(h => {
    html += '<div class="h"><div class="muted">' + fmtH(h.date) + '</div><div class="kn">' + h.wind.toFixed(0) + '</div><div class="muted">' + h.gust.toFixed(0) + '</div>' +
      '<span class="arr" style="transform:rotate(' + (h.dir + 180) + 'deg)">↑</span><div class="bar" style="background:' + COLORS[h.r.cls] + '"></div></div>';
  });
  html += '</div><div class="muted">Vento médio / rajada em nós · seta = para onde o vento sopra</div>' +
    '<div class="legend">' + ["great","good","ok","bad","danger"].map(c => '<span style="background:' + COLORS[c] + '">' + LABEL[c] + '</span>').join("") + '</div></div>';

  // Próximos 7 dias
  const days = {};
  hours.forEach(h => { const k = h.t.slice(0,10); (days[k] = days[k] || []).push(h); });
  html += '<div class="card"><h2>Próximos dias</h2>';
  Object.values(days).forEach(list => {
    const day = list.filter(h => h.isDay);
    if (!day.length) return;
    const best = day.reduce((a,b) => b.r.score > a.r.score ? b : a);
    const w = bestWindow(list);
    const shown = w ? w.peak : best;
    html += '<div class="day"><div class="dn">' + fmtDay(list[0].date) + '</div>' +
      '<div class="info"><b>' + shown.wind.toFixed(0) + ' nós</b> ' + dirName(shown.dir) + ' · rajada ' + shown.gust.toFixed(0) + '<br>' +
      (w ? 'Janela: ' + fmtH(w.start.date) + '–' + fmtH(new Date(w.end.date.getTime() + 3600e3)) + ' (' + w.len + 'h)' : 'sem janela boa') + '</div>' +
      '<div class="pill" style="background:' + COLORS[shown.r.cls] + '">' + LABEL[shown.r.cls] + '</div></div>';
  });
  html += '</div><div class="card" id="cmpCard"><h2>🏆 Melhor pico</h2><div id="cmpBody"><button class="primary" id="btnCmp" style="width:100%">Comparar todos os picos</button></div></div>' +
    '<div class="warn">Previsão: Open-Meteo (modelos, não medições). O KiteCheck faz uma estimativa automática: sempre confira o mar no local e nunca veleje sozinho.</div>';
  $("#main").innerHTML = html;
  initSea(idx);
  const bc = document.getElementById("btnCmp"); if (bc) bc.addEventListener("click", compareSpots);
  const br = document.getElementById("btnRetry"); if (br) br.addEventListener("click", load);
}

// Horas seguidas com condição boa (sem perigo); devolve o melhor bloco
function bestWindow(list){
  let best = null, cur = null;
  const ok = h => h.isDay && h.r.cls !== "danger" && h.r.score >= 62;
  list.forEach((h, i) => {
    if (ok(h)) { if (!cur) cur = {a:i, b:i, sum:0}; cur.b = i; cur.sum += h.r.score; }
    if ((!ok(h) || i === list.length - 1) && cur) { if (!best || cur.sum > best.sum) best = cur; cur = null; }
  });
  if (!best) return null;
  const hs = list.slice(best.a, best.b + 1);
  const peak = hs.reduce((x, y) => (y.r.score > x.r.score || (y.r.score === x.r.score && y.wind > x.wind)) ? y : x);
  return {start:hs[0], end:hs[hs.length - 1], len:hs.length, val:best.sum, peak,
    avg:Math.round(hs.reduce((s, h) => s + h.wind, 0) / hs.length), maxGust:Math.round(Math.max(...hs.map(h => h.gust)))};
}

// Alertas de agora + das próximas horas (não dependem da nota)
function upcomingAlerts(hours, idx){
  const out = (hours[idx].r.alerts || []).slice();
  if (!out.some(a => a.t.indexOf("⛈️") === 0)) {
    for (let i = idx + 1; i <= Math.min(hours.length - 1, idx + 6); i++)
      if (hours[i].code >= 95) { out.push({lvl:"crit", t:"⛈️ Risco de trovoada a partir das " + fmtH(hours[i].date) + "."}); break; }
  }
  for (let i = idx; i + 3 < hours.length && i <= idx + 6; i++) {
    const a = hours[i], b = hours[i + 3];
    if ((a.isDay || b.isDay) && Math.abs(b.wind - a.wind) >= 10) {
      out.push({lvl:"warn", t:"🔀 Mudança brusca: o vento vai de " + a.wind.toFixed(0) + " para " + b.wind.toFixed(0) + " nós até as " + fmtH(b.date) + "."}); break;
    }
  }
  return out;
}

function statusHTML(){
  const d = lastData;
  if (d.cachedAt) {
    const ageH = Math.round((Date.now() - d.cachedAt) / 36e5);
    return '<div class="card stale">📴 <b>Sem conexão.</b> Mostrando a previsão salva de ' +
      new Date(d.cachedAt).toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}) +
      (ageH >= 1 ? ' (há ' + ageH + ' h)' : '') + ': pode estar desatualizada. <button id="btnRetry">Tentar de novo</button></div>';
  }
  return '<div class="upd">🔄 Atualizado às ' + new Date(d.fetchedAt || Date.now()).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}) + '</div>';
}

function windChart(hours, idx){
  const list = hours.slice(idx, idx + 25); if (list.length < 2) return "";
  const L = LEVELS[cfg.level], W = 340, H = 170, pl = 26, pr = 6, pt = 10, pb = 22;
  const top = Math.max(L.max + 5, Math.ceil(Math.max(...list.map(h => h.gust)) / 5) * 5 + 5);
  const X = i => pl + i * (W - pl - pr) / (list.length - 1), Y = v => pt + (1 - v / top) * (H - pt - pb);
  const f = n => n.toFixed(1);
  let s = '<svg class="wchart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gráfico de vento e rajadas">';
  list.forEach((h, i) => { if (i < list.length - 1) {
    if (!h.isDay) s += '<rect x="' + f(X(i)) + '" y="' + pt + '" width="' + f(X(i + 1) - X(i)) + '" height="' + (H - pt - pb) + '" fill="rgba(0,0,0,.28)"/>';
    else if (h.r.score >= 62 && h.r.cls !== "danger") s += '<rect x="' + f(X(i)) + '" y="' + pt + '" width="' + f(X(i + 1) - X(i)) + '" height="' + (H - pt - pb) + '" fill="rgba(34,197,94,.16)"/>';
  }});
  s += '<rect x="' + pl + '" y="' + f(Y(L.max)) + '" width="' + (W - pl - pr) + '" height="' + f(Y(cfg.min) - Y(L.max)) + '" fill="rgba(56,189,248,.07)"/>';
  for (let v = 0; v <= top; v += 10) s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + f(Y(v)) + '" y2="' + f(Y(v)) + '" stroke="#16486b" stroke-width="1"/><text x="' + (pl - 4) + '" y="' + f(Y(v) + 3) + '" text-anchor="end" class="wc-t">' + v + '</text>';
  s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + f(Y(cfg.min)) + '" y2="' + f(Y(cfg.min)) + '" stroke="#facc15" stroke-dasharray="4 3" stroke-width="1.2"/>';
  s += '<path d="M' + list.map((h, i) => f(X(i)) + ',' + f(Y(h.gust))).join(' L') + ' L' + list.map((h, i) => f(X(i)) + ',' + f(Y(h.wind))).reverse().join(' L') + 'Z" fill="rgba(249,115,22,.22)"/>';
  s += '<polyline points="' + list.map((h, i) => f(X(i)) + ',' + f(Y(h.gust))).join(' ') + '" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3 2"/>';
  s += '<polyline points="' + list.map((h, i) => f(X(i)) + ',' + f(Y(h.wind))).join(' ') + '" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  list.forEach((h, i) => { if (i % 3 === 0) s += '<text x="' + f(X(i)) + '" y="' + (H - 6) + '" text-anchor="middle" class="wc-t">' + fmtH(h.date) + '</text>'; });
  return s + '</svg><div class="wc-leg"><span><i style="background:#38bdf8"></i>vento médio</span><span><i style="background:#f97316"></i>rajadas</span>' +
    '<span><i style="background:#facc15"></i>seu mínimo (' + cfg.min + ' nós)</span><span><i style="background:rgba(34,197,94,.55)"></i>horas boas</span><span><i style="background:rgba(0,0,0,.5)"></i>noite</span></div>';
}

function heroExtra(){
  const d = lastData, out = [], cur = d.hours[d.idx];
  const s = d.sun && d.sun[cur.t.slice(0,10)];
  if (s && s.rise) out.push("☀️ Sol " + s.rise + "–" + s.set + (s.uv != null ? " · UV máx " + s.uv.toFixed(0) + (s.uv >= 8 ? " (passe protetor!)" : "") : ""));
  if (cur.conf) out.push("📊 Os modelos de previsão " + (cur.conf === "alta" ? "concordam" : cur.conf === "média" ? "concordam em parte" : "discordam") + " (confiança " + cur.conf + ", " + d.nModels + " modelos)");
  return out.map(x => '<div class="kite">' + x + '</div>').join("");
}

async function compareSpots(){
  const body = document.getElementById("cmpBody"); if (!body) return;
  body.innerHTML = '<span class="spin"></span> Comparando ' + spots.length + ' picos…';
  const coords = "latitude=" + spots.map(s => s.lat).join(",") + "&longitude=" + spots.map(s => s.lon).join(",");
  const url = "https://api.open-meteo.com/v1/forecast?" + coords +
    "&hourly=precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&wind_speed_unit=kn&timezone=auto&forecast_days=2";
  const murl = "https://marine-api.open-meteo.com/v1/marine?" + coords + "&hourly=wave_height&timezone=auto&forecast_days=2";
  try {
    let [res, mres] = await Promise.all([
      getJSON(url).catch(() => Promise.all(spots.map(s => getJSON(url.replace(/latitude=[^&]*&longitude=[^&]*/, "latitude=" + s.lat + "&longitude=" + s.lon))))),
      getJSON(murl).catch(() => null)
    ]);
    if (!Array.isArray(res)) res = [res];
    if (mres && !Array.isArray(mres)) mres = [mres];
    const rows = spots.map((s, k) => {
      const H = res[k].hourly, nk = nowKey(res[k].utc_offset_seconds || 0), wv = {}, list = [];
      const M = mres && mres[k] && mres[k].hourly;
      if (M) M.time.forEach((t, i) => wv[t] = M.wave_height[i]);
      H.time.forEach((t, i) => {
        if (t < nk) return;
        const h = {t, date:new Date(t), wind:H.wind_speed_10m[i] ?? 0, gust:H.wind_gusts_10m[i] ?? 0, dir:H.wind_direction_10m[i] ?? 0,
          rain:H.precipitation_probability[i] ?? 0, code:H.weather_code[i] ?? 0, isDay:H.is_day[i] === 1, wave: s.lagoon ? null : (wv[t] ?? null)};
        h.r = rate(h, s); list.push(h);
      });
      const byDay = {}; list.forEach(h => (byDay[h.t.slice(0,10)] = byDay[h.t.slice(0,10)] || []).push(h));
      let pick = null; Object.keys(byDay).sort().some(d => (pick = bestWindow(byDay[d])) != null);
      const dayH = list.filter(h => h.isDay);
      const bestH = dayH.length ? dayH.reduce((a, b) => b.r.score > a.r.score ? b : a) : null;
      return {s, pick, bestH, hasSea: !s.lagoon && list.some(h => h.wave != null)};
    }).filter(r => r.bestH);
    const value = r => r.pick ? 1000 + r.pick.val : (r.bestH.r.cls === "danger" ? 0 : r.bestH.r.score);
    rows.sort((a, b) => value(b) - value(a));
    body.innerHTML = rows.map(row => {
      const p = row.pick, h = p ? p.peak : row.bestH;
      const when = p ? fmtDay(p.start.date) + " " + fmtH(p.start.date) + "–" + fmtH(new Date(p.end.date.getTime() + 3600e3)) + " (" + p.len + "h)" : "sem janela boa hoje/amanhã";
      const sea = row.s.lagoon ? "lagoa" : (row.hasSea && h.wave != null ? "mar " + h.wave.toFixed(1) + " m" : "sem dados de mar");
      return '<div class="cmp-row" data-id="' + esc(row.s.id) + '"><div class="info"><b>' + esc(row.s.name) + '</b><br>' + when + '<br>' +
        '<span class="muted">' + (p ? p.avg : Math.round(h.wind)) + ' nós · rajada ' + (p ? p.maxGust : Math.round(h.gust)) + ' · ' + sea + '</span></div>' +
        '<div class="pill" style="background:' + COLORS[h.r.cls] + '">' + LABEL[h.r.cls] + '</div></div>';
    }).join("") + '<div class="muted" style="margin-top:6px">Ordenado pela melhor janela de hoje e amanhã (horas seguidas boas). Considera vento, rajadas, direção, chuva e ondas quando há dados. Toque num pico para abrir.</div>';
    body.querySelectorAll("[data-id]").forEach(el => el.addEventListener("click", () => { cfg.spot = el.getAttribute("data-id"); window.scrollTo(0, 0); load(); }));
  } catch(e) {
    body.innerHTML = '<div class="muted">Não consegui comparar agora (' + esc(e.message) + ').</div><button id="btnCmp2" style="width:100%;margin-top:8px">Tentar de novo</button>';
    document.getElementById("btnCmp2").addEventListener("click", compareSpots);
  }
}

// ---------- Mar: onda animada estilo "coroa do Apple Watch" ----------
const SEA_STATES = [
  [0.1,"Espelhado","#7dd3fc"],[0.5,"Calmo / marola","#38bdf8"],[1.25,"Pouco agitado","#22c55e"],
  [2.5,"Agitado","#facc15"],[4,"Muito agitado","#f97316"],[99,"Mar grosso","#ef4444"]
];
const seaState = wh => SEA_STATES.find(s => wh < s[0]) || SEA_STATES[SEA_STATES.length-1];
let seaAnim = null;

function initSea(start){
  const cv = document.getElementById("waveCv"), sc = document.getElementById("seaScrub");
  if (!cv || !sc || !cv.getContext || !lastData) return;
  const hours = lastData.hours, ctx = cv.getContext("2d"), tcv = document.getElementById("tideCv");
  let sel = start, shownH = 0, shownP = 8, shownW = 0, phase = 0, last = performance.now();

  function fit(c){ const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    if (c.width !== Math.round(r.width*d)) { c.width = Math.round(r.width*d); c.height = Math.round(r.height*d); }
    c.getContext("2d").setTransform(d,0,0,d,0,0); return [r.width, r.height]; }

  function select(i){
    i = Math.max(+sc.min, Math.min(+sc.max, Math.round(i)));
    sel = i; sc.value = i;
    const h = hours[i], s = h.sea || {};
    const st = s.wh != null ? seaState(s.wh) : null;
    $("#seaWhen").innerHTML = i === start ? '<span class="when-chip now">● Agora · ' + fmtH(h.date) + '</span>' : '<span class="when-chip">🕒 ' + dayLong(h.date) + ' · ' + fmtH(h.date) + '</span>';
    $("#seaH").textContent = s.wh != null ? s.wh.toFixed(1) + " m" : "–";
    $("#seaH").style.color = st ? st[2] : "";
    $("#seaState").textContent = st ? st[1] : "Sem dados";
    $("#seaDir").textContent = (s.wp != null ? "Período " + s.wp.toFixed(0) + " s" : "") + (s.wd != null ? " · de " + dirName(s.wd) : "");
    $("#seaSwell").textContent = s.sh != null ? s.sh.toFixed(1) + " m · " + (s.sp != null ? s.sp.toFixed(0) + " s" : "") : "–";
    $("#seaWind").textContent = s.ww != null ? s.ww.toFixed(1) + " m" : "–";
    $("#seaTemp").textContent = s.sst != null ? s.sst.toFixed(0) + "°" : "–";
    const nx = hours[i+1] && hours[i+1].sea, tTxt = s.tide != null ? s.tide.toFixed(2) + " m" : "–";
    $("#seaTide").textContent = tTxt + (s.tide != null && nx && nx.tide != null ? (nx.tide > s.tide ? " ↑" : " ↓") : "");
    drawTide();
  }

  function drawTide(){
    if (!tcv) return; const [W,H] = fit(tcv), c = tcv.getContext("2d"); c.clearRect(0,0,W,H);
    const a = Math.max(0, sel-12), b = Math.min(hours.length-1, sel+12), pts = [];
    for (let i=a;i<=b;i++) if (hours[i].sea && hours[i].sea.tide != null) pts.push([i, hours[i].sea.tide]);
    if (pts.length < 3) return;
    const lo = Math.min(...pts.map(p=>p[1])), hi = Math.max(...pts.map(p=>p[1])), rg = (hi-lo) || 1;
    const X = i => (i-a)/(b-a||1)*(W-8)+4, Y = v => H-8-(v-lo)/rg*(H-20);
    c.beginPath(); pts.forEach((p,k)=> k ? c.lineTo(X(p[0]),Y(p[1])) : c.moveTo(X(p[0]),Y(p[1])));
    c.strokeStyle = "#38bdf8"; c.lineWidth = 2; c.stroke();
    c.lineTo(X(pts[pts.length-1][0]),H); c.lineTo(X(pts[0][0]),H); c.closePath(); c.fillStyle = "rgba(56,189,248,.15)"; c.fill();
    const cur = pts.find(p=>p[0]===sel); if (cur){ c.beginPath(); c.arc(X(sel),Y(cur[1]),4.5,0,7); c.fillStyle="#fff"; c.fill(); }
    c.fillStyle = "#8fb3c9"; c.font = "11px -apple-system,system-ui"; c.fillText("maré ±12h", 6, 12);
  }

  function frame(now){
    if (!document.getElementById("waveCv")) { seaAnim = null; return; }
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    const s = hours[sel].sea || {}, tH = s.wh || 0, tP = s.wp || 8, tW = s.ww || 0;
    shownH += (tH-shownH)*Math.min(1, dt*5); shownP += (tP-shownP)*Math.min(1, dt*5); shownW += (tW-shownW)*Math.min(1, dt*5);
    const [W,H] = fit(cv); ctx.clearRect(0,0,W,H);
    const sky = ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#0b3b5c"); sky.addColorStop(1,"#062a42");
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);
    const pxM = H*0.16, base = H*0.62;              // 1 metro = 16% da altura
    const amp = Math.min(shownH, 5) * pxM / 2, lam = 70 + shownP*16, spd = 0.9 + 8/Math.max(shownP,3);
    phase += dt*spd;
    const col = (seaState(shownH)[2]);
    const layers = [[0.55,0.6,"rgba(56,189,248,.25)",-14],[0.8,1.3,"rgba(14,116,170,.55)",-6],[1,0,"rgba(8,80,130,.95)",0]];
    let yAt = null;
    layers.forEach(([k,off,fill,dy]) => {
      ctx.beginPath(); ctx.moveTo(0,H);
      for (let x=0;x<=W;x+=3){
        const y = base+dy - amp*k*Math.sin((x/lam)*2*Math.PI - phase*2 + off)
                  - shownW*pxM*0.12*k*Math.sin((x/(lam*0.27))*2*Math.PI + phase*3.1 + off*2);
        ctx.lineTo(x,y);
      }
      ctx.lineTo(W,H); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    });
    // crista com a cor do estado do mar
    ctx.beginPath();
    for (let x=0;x<=W;x+=3){ const y = base - amp*Math.sin((x/lam)*2*Math.PI - phase*2) - shownW*pxM*0.12*Math.sin((x/(lam*0.27))*2*Math.PI + phase*3.1); x ? ctx.lineTo(x,y) : ctx.moveTo(x,y); if (Math.abs(x-60)<2) yAt = y; }
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
    // pessoa de 1,75 m na prancha (referência de tamanho)
    const py = (yAt ?? base) - 2, ph = 1.75*pxM;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(44,py); ctx.lineTo(76,py); ctx.stroke();                         // prancha
    ctx.beginPath(); ctx.moveTo(56,py); ctx.lineTo(60,py-ph*0.45); ctx.lineTo(64,py);             // pernas
    ctx.moveTo(60,py-ph*0.45); ctx.lineTo(60,py-ph*0.82);                                        // tronco
    ctx.moveTo(60,py-ph*0.68); ctx.lineTo(70,py-ph*0.6); ctx.stroke();                          // braço
    ctx.beginPath(); ctx.arc(60,py-ph*0.91,ph*0.09,0,7); ctx.fillStyle="#fff"; ctx.fill();         // cabeça
    // régua
    ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.font = "11px -apple-system,system-ui";
    ctx.fillText("pessoa 1,75 m", 80, Math.max(14, py-ph+8));
    seaAnim = requestAnimationFrame(frame);
  }

  // Arrastar a onda = girar a "coroa": esquerda avança, direita volta
  let dragX = null, dragV = 0;
  cv.addEventListener("pointerdown", e => { dragX = e.clientX; dragV = sel; cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing"; });
  cv.addEventListener("pointermove", e => { if (dragX === null) return; select(dragV + (dragX - e.clientX)/14); });
  const end = () => { dragX = null; cv.style.cursor = "grab"; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  cv.addEventListener("wheel", e => { e.preventDefault(); select(sel + Math.sign(e.deltaY || e.deltaX)); }, {passive:false});
  sc.addEventListener("input", () => select(+sc.value));

  if (seaAnim) cancelAnimationFrame(seaAnim);
  select(start);
  shownH = (hours[start].sea && hours[start].sea.wh) || 0;
  seaAnim = requestAnimationFrame(frame);
}

// Horários vêm no fuso do pico; o objeto Date é interpretado como local, então formatamos direto da string
function fmtH(d){ return String(d.getHours()).padStart(2,"0")+"h"; }
function dayLong(d){
  const s = fmtDay(d); if (s === "Hoje" || s === "Amanhã") return s;
  const w = d.toLocaleDateString("pt-BR",{weekday:"long"}).split("-")[0];
  return w.charAt(0).toUpperCase() + w.slice(1);
}
function fmtDay(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const diff = Math.round((dd - today)/864e5);
  if (diff === 0) return "Hoje";
  if (diff === 1) return "Amanhã";
  const w = d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","");
  return w.charAt(0).toUpperCase() + w.slice(1);
}

};
var SEA_DIRS = [[0,"N","Norte"],[45,"NE","Nordeste"],[90,"L","Leste"],[135,"SE","Sudeste"],[180,"S","Sul"],[225,"SO","Sudoeste"],[270,"O","Oeste"],[315,"NO","Noroeste"]];

function openSettings(newSpot){
  const spot = spots.find(s => s.id === cfg.spot) || {};
  draft = {weight:cfg.weight, level:cfg.level, min:cfg.min, kites:(cfg.kites || []).slice(), name:spot.name || "",

function stSec(title, body){ return '<section class="st-sec"><h3>' + title + '</h3>' + body + '</section>'; }

function compassHTML(sea){
  let h = '<div class="st-compass"><div class="st-needle" id="stNeedle" style="transform:rotate(' + sea + 'deg)"></div><div class="st-beach">🏖️</div>';
  SEA_DIRS.forEach(([deg, ab]) => {
    const x = 50 + 41 * Math.sin(deg * Math.PI / 180), y = 50 - 41 * Math.cos(deg * Math.PI / 180);
    h += '<button class="st-dir' + (deg === sea ? ' on' : '') + '" data-sea="' + deg + '" style="left:' + x.toFixed(1) + '%;top:' + y.toFixed(1) + '%">' + ab + '</button>';
  });
  return h + '</div>';
}

function renderSettings(tab){
  const d = draft;
  const tabs = [["voce","👤 Você"],["pico","📍 Pico"],["app","⚙️ App"]];
  let h = '<div class="st-head"><h2>Ajustes</h2><button class="st-x" id="stClose" aria-label="Fechar">✕</button></div>';
  h += '<div class="st-tabs">' + tabs.map(t => '<button class="st-tab' + (t[0] === tab ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>').join("") + '</div><div class="st-body">';
  if (tab === "voce") {
    h += stSec("Seu peso", '<div class="st-big"><span id="stW">' + d.weight + '</span> kg</div><input type="range" id="stWeight" min="40" max="130" value="' + d.weight + '">');
    h += stSec("Seu nível", '<div class="st-levels">' + Object.keys(LEVEL_INFO).map(k => '<button class="st-lv' + (k === d.level ? ' on' : '') + '" data-lv="' + k + '"><b>' + LEVEL_INFO[k][0] + '</b><small>' + LEVEL_INFO[k][1] + '</small></button>').join("") + '</div>');
    h += stSec("Vento mínimo pra você", '<div class="st-big"><span id="stM">' + d.min + '</span> nós</div><input type="range" id="stMin" min="6" max="20" value="' + d.min + '"><div class="muted">Abaixo disso o app considera o vento fraco demais.</div>');
    h += stSec("Seus kites (m²)", '<div class="st-chips">' + KITE_SIZES.map(s => '<button class="st-chip' + (d.kites.indexOf(s) >= 0 ? ' on' : '') + '" data-k="' + s + '">' + s + '</button>').join("") + '</div><div class="muted" id="stKsum"></div>');
  } else if (tab === "pico") {
    h += stSec("Nome do pico", '<input id="stName" type="text" value="' + esc(d.name) + '">');
    h += stSec("Para que lado fica o mar?", compassHTML(d.sea) + '<div class="st-center" id="stSeaTxt"></div><div class="muted st-center">Olhando da areia para a água. Serve para saber se o vento vem do mar (seguro) ou da terra (perigoso).</div>');
    h += stSec("Tipo de pico", '<label class="st-sw"><input type="checkbox" id="stLagoon"' + (d.lagoon ? ' checked' : '') + '><span></span>É lagoa (ondas do oceano não contam)</label>');
    h += stSec("Localização", '<div class="muted" id="stCoord">' + (d.lat != null ? d.lat.toFixed(4) + ", " + d.lon.toFixed(4) : "–") + '</div><button id="stGpsHere" class="st-wide">📍 Usar minha localização atual neste pico</button>');
    h += '<button id="stDelete" class="st-wide st-danger" style="margin-top:14px">🗑️ Excluir este pico</button>';
  } else {
    h += stSec("Picos", '<button id="stRestore" class="st-wide" style="margin-top:0">↩️ Restaurar picos padrão</button><div class="muted" style="margin-top:6px">Traz de volta os picos que você excluiu.</div>');
    h += stSec("Dados", '<button id="stReset" class="st-wide st-danger" style="margin-top:0">Apagar todas as configurações</button><div class="muted" style="margin-top:6px">Volta tudo ao padrão neste aparelho.</div>');
    h += stSec("Sobre", '<div class="muted">KiteCheck · previsão do tempo e do mar: Open-Meteo (CC BY 4.0). Use como referência: sempre confira o mar no local e nunca veleje sozinho.</div>');
  }
  h += '</div><div class="st-foot"><button id="stCancel">Cancelar</button><button class="primary" id="stSave">Salvar</button></div>';
  $("#dlg").innerHTML = h;
  bindSettings(tab);
}

function bindSettings(tab){
  const d = draft, dlg = $("#dlg"), q = s => dlg.querySelector(s), qa = s => dlg.querySelectorAll(s);
  q("#stClose").onclick = () => dlg.close();
  q("#stCancel").onclick = () => dlg.close();
  q("#stSave").onclick = saveSettings;
  qa(".st-tab").forEach(b => b.onclick = () => renderSettings(b.dataset.tab));
  if (tab === "voce") {
    const ksum = () => { const lo = Math.round(d.weight * 2.2 / 25), hi = Math.round(d.weight * 2.2 / 12);
      q("#stKsum").textContent = (d.kites.length ? "Você tem: " + d.kites.join(" · ") + " m². " : "Toque nos tamanhos que você tem. ") +
        "Com " + d.weight + " kg, entre 12 e 25 nós se usa de " + lo + " a " + hi + " m²."; };
    q("#stWeight").oninput = e => { d.weight = +e.target.value; q("#stW").textContent = d.weight; ksum(); };
    q("#stMin").oninput = e => { d.min = +e.target.value; q("#stM").textContent = d.min; };
    qa(".st-lv").forEach(b => b.onclick = () => { d.level = b.dataset.lv; qa(".st-lv").forEach(x => x.classList.toggle("on", x === b)); });
    qa(".st-chip").forEach(b => b.onclick = () => { const k = +b.dataset.k, i = d.kites.indexOf(k);
      if (i >= 0) d.kites.splice(i, 1); else d.kites.push(k); d.kites.sort((a, c) => a - c); b.classList.toggle("on", i < 0); ksum(); });
    ksum();
  } else if (tab === "pico") {
    const seaTxt = () => { const s = SEA_DIRS.find(x => x[0] === d.sea); q("#stSeaTxt").innerHTML = "🌊 O mar fica para o <b>" + (s ? s[2] : d.sea + "°") + "</b>"; };
    qa(".st-dir").forEach(b => b.onclick = () => { d.sea = +b.dataset.sea; qa(".st-dir").forEach(x => x.classList.toggle("on", x === b)); q("#stNeedle").style.transform = "rotate(" + d.sea + "deg)"; seaTxt(); });
    seaTxt();
    q("#stName").oninput = e => { d.name = e.target.value; };
    q("#stLagoon").onchange = e => { d.lagoon = e.target.checked; };
    q("#stGpsHere").onclick = () => {
      if (!navigator.geolocation) { q("#stCoord").textContent = "Seu navegador não permite localização."; return; }
      q("#stCoord").textContent = "Pegando sua localização…";
      navigator.geolocation.getCurrentPosition(p => { d.lat = +p.coords.latitude.toFixed(4); d.lon = +p.coords.longitude.toFixed(4); q("#stCoord").textContent = d.lat + ", " + d.lon + " (toque em Salvar para aplicar)"; },
        () => { q("#stCoord").textContent = "Não consegui sua localização (permita em Ajustes › Safari)."; }, {enableHighAccuracy:true, timeout:15000});
    };
    q("#stDelete").onclick = function(){
      if (spots.length <= 1) return;
      if (this.dataset.ok !== "1") { this.dataset.ok = "1"; this.textContent = "Toque de novo para confirmar a exclusão"; return; }
      const del = store.get("kc_deleted", []); del.push(cfg.spot); store.set("kc_deleted", del);
      spots = spots.filter(s => s.id !== cfg.spot); cfg.spot = spots[0].id;
      store.set("kc_spots", spots); store.set("kc_cfg", cfg); dlg.close(); load();
    };
  } else {
    q("#stRestore").onclick = () => { store.set("kc_deleted", []);
      DEFAULT_SPOTS.forEach(d0 => { if (!spots.find(s => s.id === d0.id)) spots.push(Object.assign({}, d0)); });
      store.set("kc_spots", spots); dlg.close(); load(); };
    q("#stReset").onclick = function(){
      if (this.dataset.ok !== "1") { this.dataset.ok = "1"; this.textContent = "Toque de novo para apagar tudo"; return; }
      ["kc_spots","kc_cfg","kc_deleted","kc_last"].forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
      location.reload();
    };
  }
}

var GUIDE_SIT = [
  ["🍃","Vento fraco (8–12 nós)","Use seu maior kite e uma prancha maior. Abaixo de 10 nós, só com foil. Foil kites (sem câmaras de ar) brilham aqui."],
  ["👌","Vento médio (12–20 nós)","A faixa mais gostosa: kite médio, puxada constante. Ideal pra aprender e evoluir."],
  ["💨","Vento forte (20–28 nós)","Kite pequeno. Na dúvida entre dois tamanhos, vá sempre no menor."],
  ["🌪️","Vento rajado","Escolha pelo vento das rajadas, não pela média: kite menor e mão no depower. Iniciantes devem evitar."],
  ["🌊","Mar com ondas","Kites de onda (wave) têm drift: ficam parados no céu enquanto você surfa. Use um tamanho um pouco menor."],
  ["🏞️","Lagoa / água lisa","Perfeito pra aprender e pra freestyle. Kites híbridos ou C dão mais pop nos saltos."],
  ["⛈️","Frente fria / chuva","Vento muda de força e direção de repente. Saia da água se vir nuvem escura chegando ou ouvir trovão."],
  ["🏠","Vento terral (offshore)","Te empurra pro alto-mar. Não entre, a não ser com barco de apoio."]
];
var GUIDE_TYPES = [
  ["Bow / SLE","Muito depower e relança fácil. Ótimo pra iniciantes e vento variado."],
  ["Delta","Relança muito fácil e tem faixa de vento enorme. Comum em escolas."],
  ["Híbrido","Meio-termo: estável e com bom pop. O mais versátil (all-round)."],
  ["C-kite","Puxada direta e pop forte pra manobras. Pouco depower: pra avançados."],
  ["Wave","Feito pra ondas: drift, giro rápido e estabilidade."],
  ["Foil kite","Sem câmaras de ar, sobe com pouquíssimo vento. Mais difícil de relançar na água."]
];
function guideSize(w, kg){ return Math.max(4, Math.min(19, Math.round(kg * 2.2 / w))); }
function guideHTML(d){
  const gw = d.guideWind || 16;
  let h = stSec("Qual kite pra esse vento?", '<div class="st-big"><span id="gW">' + gw + '</span> nós</div><input type="range" id="gWind" min="8" max="35" value="' + gw + '"><div id="gOut"></div>');
  h += stSec("Tabela pra " + d.weight + " kg", '<div id="gTable"></div><div class="muted" style="margin-top:6px">Valores aproximados pra prancha bidirecional (twin-tip). ✓ = você tem um kite desse tamanho (±1 m²).</div>');
  h += stSec("Cada situação", GUIDE_SIT.map(s => '<div class="g-card"><div class="g-ic">' + s[0] + '</div><div><b>' + s[1] + '</b><div class="muted">' + s[2] + '</div></div></div>').join(""));
  h += stSec("Tipos de kite", GUIDE_TYPES.map(s => '<div class="g-card"><div><b>' + s[0] + '</b><div class="muted">' + s[1] + '</div></div></div>').join(""));
  return h;
}
function bindGuide(q, d){
  const winds = [10,12,14,16,18,20,22,25,28,32];
  const draw = () => {
    const gw = d.guideWind || 16, sz = guideSize(gw, d.weight), L = LEVELS[d.level];
    const has = d.kites.filter(k => Math.abs(k - sz) <= 1);
    let tip = gw < 12 ? "Vento fraco: kite grande e prancha grande (ou foil)." : gw <= 20 ? "Faixa ideal pra maioria das pessoas." : gw <= 28 ? "Vento forte: na dúvida, vá no menor." : "Muito forte: só pra avançados.";
    if (gw > L.max) tip += " ⚠️ Acima do limite do seu nível (" + L.max + " nós).";
    q("#gOut").innerHTML = '<div class="g-res"><div class="g-size">' + sz + ' m²</div><div>' + tip + '<br><span class="muted">' +
      (d.kites.length ? (has.length ? "✅ Você tem: " + has.join(" ou ") + " m²." : "❌ Nenhum dos seus kites serve bem (você tem " + d.kites.join(", ") + " m²).") : "Marque seus kites na aba Você.") + '</span></div></div>';
    const near = Math.min(...winds.map(x => Math.abs(x - gw)));
    q("#gTable").innerHTML = '<div class="g-table">' + winds.map(w => { const s = guideSize(w, d.weight), ok = d.kites.some(k => Math.abs(k - s) <= 1);
      return '<div class="g-row' + (Math.abs(w - gw) === near ? ' on' : '') + '"><span>' + w + ' nós</span><b>' + s + ' m²</b><span>' + (ok ? "✓" : "") + '</span></div>'; }).join("") + '</div>';
  };
  q("#gWind").oninput = e => { d.guideWind = +e.target.value; q("#gW").textContent = d.guideWind; draw(); };
  draw();
}

function saveSettings(){
  const d = draft;
  cfg.weight = Math.max(30, Math.min(150, d.weight)); cfg.level = d.level; cfg.min = d.min; cfg.kites = d.kites.slice();
  const spot = spots.find(s => s.id === cfg.spot);
  if (spot) { spot.name = (d.name || "").trim() || spot.name; spot.sea = d.sea; spot.lagoon = d.lagoon; if (d.lat != null) { spot.lat = d.lat; spot.lon = d.lon; } }
  store.set("kc_cfg", cfg); store.set("kc_spots", spots);
  $("#dlg").close(); load();
  if (!$("#viewGuia").hidden) renderGuidePage();
}
$("#btnSettings").addEventListener("click", () => openSettings(false));

// ---------- Navegação (Previsão / Guia) ----------
var guideState = null;
function showView(v){
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  $("#viewPrev").hidden = v !== "prev"; $("#viewGuia").hidden = v !== "guia";
  if (v === "guia") renderGuidePage();
  try { history.replaceState(null, "", v === "guia" ? "#guia" : location.pathname + location.search); } catch(e){}
  window.scrollTo(0, 0);
}
function renderGuidePage(){
  const cur = lastData && lastData.hours ? lastData.hours[lastData.idx || 0] : null;
  const nowW = cur ? Math.round(cur.wind) : null;
  guideState = {weight:cfg.weight, level:cfg.level, kites:(cfg.kites || []).slice(),
    guideWind: guideState ? guideState.guideWind : (nowW != null && nowW >= 8 ? Math.min(35, nowW) : 16)};
  const el = $("#viewGuia");
  el.innerHTML = '<div class="ghead"><h2>📚 Guia de kites</h2><div class="muted">Pra ' + cfg.weight + ' kg' +
    (cfg.kites && cfg.kites.length ? ' · seus kites: ' + cfg.kites.join(", ") + ' m²' : '') +
    (nowW != null ? ' · agora em ' + esc(lastData.spot.name) + ': ' + nowW + ' nós' : '') + '. Peso e kites você muda em ⚙︎.</div></div>' + guideHTML(guideState);
  bindGuide(s => el.querySelector(s), guideState);
}
document.querySelectorAll("#nav button").forEach(b => b.addEventListener("click", () => showView(b.dataset.view)));
if (location.hash === "#guia") showView("guia");

// Atualiza ao voltar pro app
document.addEventListener("visibilitychange", () => { if (!document.hidden && lastData) load(); });
load();
</script>
